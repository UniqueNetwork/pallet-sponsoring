[package]
authors = ['Unique Network <support@uniquenetwork.io>']
description = 'Sponsorning demo node'
edition = '2021'
homepage = 'https://unique.network'
license = 'All Rights Reserved'
name = 'pallet-template'
publish = false
repository = 'https://github.com/UniqueNetwork/pallet-sponsoring'
version = '3.0.0'

[package.metadata.docs.rs]
targets = ['x86_64-unknown-linux-gnu']

[dependencies]
codec = { workspace = true }
frame-benchmarking = { workspace = true, optional = true }
frame-support = { workspace = true }
frame-system = { workspace = true }
scale-info = { workspace = true }
sp-core = { workspace = true }
sp-io = { workspace = true }
sp-runtime = { workspace = true }
up-sponsorship = { workspace = true }

[features]
default = ['std']
runtime-benchmarks = ['frame-benchmarking']
std = ['codec/std', 'frame-benchmarking/std', 'frame-support/std', 'frame-system/std', 'up-sponsorship/std']
try-runtime = ['frame-support/try-runtime']
