[profile.release]
panic = 'unwind'

[workspace]
members = ['node', 'pallets/*', 'runtime']
resolver = "2"

[workspace.dependencies]
clap = { version = "4.5.3" }
codec = { default-features = false, features = ['derive'], package = 'parity-scale-codec', version = '3.1.2' }
flexi_logger = "0.22.5"
futures = "0.3.17"
hex-literal = { version = '0.3.1'}
jsonrpsee = { version = "0.23.2", features = ["server"] }
log = "0.4.14"
parking_lot = "0.12.1"
serde = { version = "1.0.130", default-features = false }
serde_json = { version = "1.0.128", default-features = false }

frame-benchmarking = { default-features = false, version = "36.0.0" }
frame-benchmarking-cli = { default-features = false, version = "40.0.0" }
frame-executive = { default-features = false, version = "36.0.0" }
frame-support = { default-features = false, version = "36.0.0" }
frame-system = { default-features = false, version = "36.0.0" }
frame-system-benchmarking = { default-features = false, version = "36.0.0" }
frame-system-rpc-runtime-api = { default-features = false, version = "33.0.0" }
pallet-aura = { default-features = false, version = "35.0.0" }
pallet-balances = { default-features = false, version = "37.0.0" }
pallet-grandpa = { default-features = false, version = "36.0.0" }
pallet-insecure-randomness-collective-flip = { default-features = false, version = "24.0.0" }
pallet-sudo = { default-features = false, version = "36.0.0" }
pallet-timestamp = { default-features = false, version = "35.0.0" }
pallet-transaction-payment = { default-features = false, version = "36.0.0" }
pallet-transaction-payment-rpc = { default-features = false, version = "38.0.0" }
pallet-transaction-payment-rpc-runtime-api = { default-features = false, version = "36.0.0" }
sc-basic-authorship = { default-features = false, version = "0.42.0" }
sc-cli = { default-features = false, version = "0.44.0" }
sc-client-api = { default-features = false, version = "35.1.0" }
sc-consensus = { default-features = false, version = "0.41.0" }
sc-consensus-aura = { default-features = false, version = "0.42.0" }
sc-consensus-grandpa = { default-features = false, version = "0.27.0" }
sc-executor = { default-features = false, version = "0.39.0" }
sc-keystore = { default-features = false, version = "32.0.0" }
sc-network = { default-features = false, version = "0.42.0" }
sc-offchain = { default-features = false, version = "37.0.0" }
sc-rpc = { default-features = false, version = "37.0.0" }
sc-rpc-api = { default-features = false, version = "0.41.0" }
sc-service = { default-features = false, version = "0.43.0" }
sc-telemetry = { default-features = false, version = "22.0.0" }
sc-transaction-pool = { default-features = false, version = "35.0.0" }
sc-transaction-pool-api = { default-features = false, version = "35.0.0" }
scale-info = { default-features = false, version = "2.0.1", features = ['derive']}
sp-api = { default-features = false, version = "33.0.0" }
sp-block-builder = { default-features = false, version = "33.0.0" }
sp-blockchain = { default-features = false, version = "35.1.0" }
sp-consensus = { default-features = false, version = "0.39.1" }
